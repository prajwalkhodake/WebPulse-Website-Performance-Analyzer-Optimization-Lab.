<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="WebPulse — Website Performance Analyzer & Optimization Lab. Static code analysis, dependency mapping, and controlled browser performance testing for web projects.">
  <meta name="author" content="WebPulse Lab">
  <meta name="csrf-token" content="{{ csrf_token() }}">
  
  <title>{% block title %}{{ title if title else app_tagline }}{% endblock %} | {{ app_name }}</title>

  <!-- Google Fonts: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Bootstrap 5.3.3 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

  <!-- Bootstrap Icons 1.11.3 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <!-- WebPulse Custom Design System -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/webpulse.css') }}">
  
  <style>
    /* Utility colors & enhancements */
    .text-cyan { color: var(--wp-cyan) !important; }
    .text-indigo { color: var(--wp-indigo) !important; }
    .text-emerald { color: var(--wp-emerald) !important; }
    .text-amber { color: var(--wp-amber) !important; }
    .text-rose { color: var(--wp-rose) !important; }
    .text-dim { color: var(--wp-text-dim) !important; }
    
    .btn-cyan {
      background-color: var(--wp-cyan);
      color: #0b1120;
      border: 1px solid var(--wp-cyan);
      font-weight: 600;
      transition: all 0.2s ease;
    }
    .btn-cyan:hover {
      background-color: #7dd3fc;
      border-color: #7dd3fc;
      color: #0b1120;
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.4);
    }

    .btn-outline-cyan {
      border: 1px solid var(--wp-cyan);
      color: var(--wp-cyan);
      transition: all 0.2s ease;
    }
    .btn-outline-cyan:hover {
      background-color: rgba(56, 189, 248, 0.15);
      color: #7dd3fc;
      border-color: #7dd3fc;
    }

    .hover-cyan:hover {
      color: var(--wp-cyan) !important;
    }

    /* Form styling overrides */
    .form-control, .form-select {
      background-color: var(--wp-surface-1);
      border: 1px solid var(--wp-border);
      color: var(--wp-text-main);
      border-radius: 8px;
      padding: 0.65rem 0.9rem;
    }
    .form-control:focus, .form-select:focus {
      background-color: var(--wp-surface-1);
      border-color: var(--wp-cyan);
      color: var(--wp-text-main);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
    }
    .form-control::placeholder {
      color: var(--wp-text-dim);
    }
    .form-label {
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--wp-text-muted);
      margin-bottom: 0.35rem;
    }
  </style>

  {% block extra_head %}{% endblock %}
</head>
<body class="d-flex flex-column min-vh-100">
  <!-- Top Navigation -->
  {% include 'components/navbar.html' %}

  <!-- Flash Alerts -->
  {% include 'components/flash.html' %}

  <!-- Primary Page Content -->
  <main class="flex-grow-1">
    {% block content %}{% endblock %}
  </main>

  <!-- Global Footer -->
  {% include 'components/footer.html' %}

  <!-- React 18 Root (headless micro-interaction components) -->
  <div id="webpulse-react-root" style="display:none;"></div>

  <!-- Bootstrap 5.3.3 JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

  <!-- React 18 & Babel Standalone (Local Vendor with CDN Fallback) -->
  <script src="{{ url_for('static', filename='js/vendor/react.production.min.js') }}"></script>
  <script>
    if (typeof React === 'undefined') {
      document.write('<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"><\/script>');
    }
  </script>
  <script src="{{ url_for('static', filename='js/vendor/react-dom.production.min.js') }}"></script>
  <script>
    if (typeof ReactDOM === 'undefined') {
      document.write('<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"><\/script>');
    }
  </script>
  <script src="{{ url_for('static', filename='js/vendor/babel.min.js') }}"></script>
  <script>
    if (typeof Babel === 'undefined') {
      document.write('<script src="https://unpkg.com/@babel/standalone/babel.min.js"><\/script>');
    }
  </script>

  <!-- WebPulse Core React App (replaces vanilla main.js) -->
  <script type="text/babel" src="{{ url_for('static', filename='js/react/WebPulseApp.jsx') }}"></script>

  {% block scripts %}{% endblock %}
  {% block extra_scripts %}{% endblock %}
</body>
</html>
